<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أحمد — حساباتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&family=Amiri:wght@700&family=Playfair+Display:ital,wght@1,500&display=swap">
<style>
:root{color-scheme:dark;--bg:#070707;--sf:#101010;--bd:#2c2515;--tx:#f5efe0;--mu:#9b917a;--ac:#d4af37;--at:#111;--sp:rgba(212,175,55,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(500px circle at var(--mx,50%) var(--my,30%),var(--sp),transparent 70%)}
.w{max-width:1120px;margin:auto;padding:0 20px;position:relative}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-weight:900;font-size:1.4rem;letter-spacing:-.5px}.logo b{color:var(--ac)}
.th{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;font-size:1.1rem;transition:transform .4s}
.th:hover{transform:rotate(180deg) scale(1.1)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;padding:44px 0 40px}
.hero h1{font-weight:900;font-size:clamp(2.3rem,6vw,4.4rem);line-height:1.4;letter-spacing:0;position:relative;z-index:2}
.hero h1 span{color:var(--ac);display:block}
.hero p{color:var(--mu);margin-top:16px;font-size:1.1rem;max-width:30ch}
.stage{perspective:1000px;display:grid;place-items:center;position:relative;min-height:340px}
#avatar{position:relative;width:min(80%,340px);padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:38px;cursor:pointer;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.9,.3,1.3);animation:fl 5s ease-in-out infinite;box-shadow:0 30px 60px -25px rgba(0,0,0,.55)}
#avatar img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;display:block;pointer-events:none}
@keyframes fl{50%{translate:0 -12px}}
.mq{border-block:1px solid var(--bd);overflow:hidden;white-space:nowrap;padding:12px 0;margin-bottom:34px}
.mq div{display:inline-block;animation:mq 22s linear infinite;font-weight:900;font-size:1.3rem;color:var(--mu)}
.mq i{color:var(--ac);font-style:normal;margin:0 18px}
@keyframes mq{to{transform:translateX(50%)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;perspective:1300px;padding-bottom:70px}
.tile{grid-column:span 1;background:var(--sf);border:1px solid var(--bd);border-radius:26px;padding:22px;min-height:210px;display:flex;flex-direction:column;position:relative;overflow:hidden;transform-style:preserve-3d;opacity:0;transform:translateY(50px) rotateX(-20deg);animation:in .8s cubic-bezier(.2,.9,.3,1.15) forwards;animation-delay:calc(var(--i)*.08s)}
.tile.s2{grid-column:1/-1;min-height:170px}.tile.w2{grid-column:span 2}
@keyframes in{to{opacity:1;transform:none}}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--gx,50%) var(--gy,0%),var(--sp),transparent 70%);opacity:0;transition:.3s;pointer-events:none}
.tile:hover::after{opacity:1}
.tile:hover{border-color:var(--ac)}
.ic{width:72px;height:72px;transition:transform .4s}
.tile:hover .ic{transform:rotate(-8deg) scale(1.08)}
.ic svg{width:100%;height:100%;display:block}
.t{font-weight:900;font-size:1.25rem;margin-top:16px;transform:translateZ(30px)}
.s{color:var(--mu);font-size:.85rem;direction:ltr;text-align:right;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transform:translateZ(20px)}
.ft{margin-top:auto;padding-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.go{border:0;border-radius:99px;padding:10px 18px;font:inherit;font-weight:900;background:linear-gradient(135deg,#f6dc82,#d4af37 55%,#a67c00);color:#111;cursor:pointer;transition:transform .15s;will-change:transform}
.go{text-decoration:none;display:inline-block;white-space:nowrap;flex:none;line-height:1.5}.go:active{scale:.94}
.ed{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:.85rem;direction:ltr}
.ed:focus{outline:none;border-color:var(--ac)}
.rip{position:fixed;width:16px;height:16px;border-radius:50%;border:2px solid var(--ac);pointer-events:none;z-index:9;translate:-50% -50%;animation:rp .7s ease-out forwards}
@keyframes rp{to{scale:8;opacity:0}}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;background:var(--ac);color:var(--at);font-weight:900;padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:10}
.toast.on{opacity:1;translate:-50% -8px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.hero{grid-template-columns:1fr;text-align:center}.hero p{margin-inline:auto}.stage{order:-1;min-height:280px}.grid{grid-template-columns:1fr}.tile.s2,.tile.w2{grid-column:span 1}}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.tile::before,#avatar::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0 62%,rgba(212,175,55,.18) 74%,rgba(246,220,130,.95) 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);filter:drop-shadow(0 0 5px rgba(212,175,55,.8));animation:sp 8s linear infinite;animation-delay:calc(var(--i,0)*-1.1s)}
@keyframes sp{to{--ang:360deg}}
@media (prefers-reduced-motion:reduce){.tile::before,#avatar::before{animation:none}}
.ayah{font-family:Amiri,Cairo,serif;font-weight:700;font-size:clamp(1.35rem,3vw,1.9rem);line-height:1.9;color:var(--ac);margin-top:22px;text-shadow:0 0 22px rgba(212,175,55,.28)}
.ayah small{display:block;font-family:Cairo,sans-serif;font-weight:400;font-size:.8rem;color:var(--mu);margin-top:2px}
.end{text-align:center;direction:ltr;padding:10px 0 70px;margin-top:-30px}
.end .ln{display:block;width:64px;height:2px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.end h3{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.6rem,4vw,2.4rem);background:linear-gradient(135deg,#f6dc82,#d4af37 55%,#a67c00);-webkit-background-clip:text;background-clip:text;color:transparent}
.end p{color:var(--mu);margin:10px auto 0;max-width:36ch;font-size:1rem;letter-spacing:.2px}
body.intro{overflow:hidden;height:100vh}
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden}
#intro .cu{position:absolute;left:0;right:0;height:50.2%;background:#070707;transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
#intro .cu.t{top:0}#intro .cu.b{bottom:0}
#intro.out{pointer-events:none}
#intro.out .cu.t{transform:translateY(-101%)}#intro.out .cu.b{transform:translateY(101%)}
.ib{position:relative;text-align:center;direction:ltr;padding:0 16px;transition:opacity .6s,transform 1s}
#intro.out .ib{opacity:0;transform:scale(1.18)}
.ib::before{content:"";position:absolute;left:50%;top:50%;width:min(80vw,520px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.22),transparent 65%);animation:pu 3s ease-in-out infinite}
@keyframes pu{50%{scale:1.25;opacity:.6}}
.ib small{position:relative;display:block;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(1.1rem,3.6vw,1.7rem);color:#d4af37;letter-spacing:.32em;opacity:0;animation:fi 1s .2s forwards}
.ib h2{position:relative;font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(2.6rem,12vw,6.2rem);letter-spacing:.04em;line-height:1.15;margin-top:6px;perspective:600px}
.ib h2 span{display:inline-block;opacity:0;transform:translateY(46px) rotateX(-70deg);background:linear-gradient(135deg,#f6dc82,#d4af37 50%,#a67c00);-webkit-background-clip:text;background-clip:text;color:transparent;animation:lt .9s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(.6s + var(--n)*.08s)}
.ib .ln{position:relative;width:0;height:2px;margin:24px auto 0;background:linear-gradient(90deg,transparent,#d4af37,transparent);animation:lw 1.8s 1.1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes lw{to{width:min(72vw,380px)}}
@keyframes lt{to{opacity:1;transform:none}}
@keyframes fi{to{opacity:1}}
#intro .pr{position:absolute;left:0;right:0;bottom:0;height:3px;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#a67c00,#f6dc82);animation:pr 4s linear forwards;z-index:2;transition:opacity .4s}
#intro.out .pr{opacity:0}
@keyframes pr{to{transform:scaleX(1)}}
@keyframes up{from{opacity:0;transform:translateY(34px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
body.intro .hero h1,body.intro .hero p,body.intro .ayah,body.intro .stage,body.intro .end{opacity:0}
.intro .tile{animation-play-state:paused}
.tile{animation-delay:calc(var(--i)*.1s + .8s)}
.ready .hero h1{animation:up 1s .35s both}
.ready .hero p{animation:up 1s .55s both}
.ready .ayah{animation:up 1s .75s both}
.ready .stage{animation:up 1.1s .45s both}
.ready .end{animation:up 1s 1.9s both}
@media (prefers-reduced-motion:reduce){#intro .pr{animation-duration:4s}}
</style>
</head>

<section class="hero">
